<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changr Hotkeys</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --border-active: #4caf50;
      --text-muted: #888888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      padding: 8px;
      user-select: none;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .status-bar {
      font-size: 11px;
      color: var(--text-muted);
      padding: 2px 4px;
      min-height: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-bar .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .status-bar .status-dot.active { background: var(--border-active); }
    .status-bar .status-dot.inactive { background: #666; }

    .variant-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 4px 0;
    }

    .variant-item {
      position: relative;
      height: 64px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .variant-item:hover { border-color: #555; }
    .variant-item.active {
      border-color: var(--border-active);
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
    }

    .variant-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .direction-badge {
      position: absolute;
      top: 2px;
      left: 2px;
      background: rgba(0, 0, 0, 0.8);
      color: #4caf50;
      font-size: 8px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      z-index: 1;
    }

    .hotkey-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
      z-index: 1;
    }

    .variant-item.empty {
      border-color: #333;
      border-style: dashed;
      color: #555;
      cursor: default;
    }

    .no-selection {
      grid-column: span 4;
      color: var(--text-muted);
      font-size: 11px;
      text-align: center;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="status-bar">
      <span class="status-dot inactive" id="statusDot"></span>
      <span id="statusText">No token selected</span>
      <span id="variantCount"></span>
    </div>
    <div id="variantStrip" class="variant-strip">
      <div class="no-selection">Select 1 image token on map to view 4-way turnaround</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
